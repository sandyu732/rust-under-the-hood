[workspace]
resolver = "3"
members = [
    "labs/*/lab-*",
    "capstones/a-rgrep",
    "capstones/b-mini-redis",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Shared dependency versions. A lab opts in with `dep = { workspace = true }`.
[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
ignore = "0.4"
rayon = "1.12"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.29", features = ["v4", "serde"] }
walkdir = "2.5"

[workspace.lints.clippy]
# Keep the default lint set; run `cargo clippy -- -W clippy::pedantic` for more.

[profile.release]
debug = 1 # keep line info so profilers and panics are readable
